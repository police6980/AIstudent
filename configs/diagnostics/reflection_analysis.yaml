name: "성찰 응답 질적 분석"
description: "학생의 5개 성찰 질문 응답을 메타인지·자기보고 관점에서 분석한다."

reference_materials:
  - "default_vygotsky.md"

# 응답 분석 차원
dimensions:
  metacognitive_depth: "자기 사고를 얼마나 구체적으로 관찰·언어화했는가 (0-5)"
  evidence_grounding: "응답이 실제 대화·개념도의 구체 증거에 기반하는가 (0-5)"
  self_observation_accuracy: "학생이 기억하는 것과 실제 대화 기록이 얼마나 일치하는가"
  depth_of_insight: "표면적 다짐을 넘어 통찰을 보이는가 (0-5)"

prompt_template: |
  당신은 교사교육 연구에서 성찰 저널 분석에 익숙한 질적 연구자입니다.
  아래 참고 자료를 바탕으로, 학생의 성찰 질문 응답 5개를 분석하세요.

  【참고 이론 자료】
  {reference_materials}

  【전체 대화 전사 (참조용)】
  {transcript_summary}

  【초기/사후 개념도 요약 (참조용)】
  {concept_map_summary}

  【학생의 성찰 응답】
  {reflection_answers}

  【분석 차원】
  {dimensions}

  【출력 — 유효한 JSON】
  {{
    "per_question_analysis": [
      {{
        "question_id": "q1_conceptual_change",
        "metacognitive_depth": 0-5,
        "evidence_grounding": 0-5,
        "depth_of_insight": 0-5,
        "self_observation_accuracy": "high | medium | low",
        "accuracy_note": "응답과 실제 대화 기록의 일치/불일치 지점",
        "key_quotes": ["인상적 응답 발췌 1~2개"],
        "analytic_summary": "이 응답을 통해 드러난 학생의 상태 2~3문장"
      }}
    ],
    "cross_question_patterns": "5개 응답을 관통하는 일관 패턴 또는 모순 2~3가지",
    "research_value_notes": "이 응답들이 연구 자료로서 어떤 분석 축에 유용한지"
  }}
