# 성찰 질문 설정
#
# 교수자는 이 파일을 직접 편집해도 되고, 교수자 관리 페이지(?admin=true)의
# "성찰 질문" 탭에서 폼으로 편집해도 된다. 저장하면 이 파일이 갱신된다.
#
# 각 항목은:
#   id:         내부 식별자 (변경 주의 — DB·리포트에서 이 ID로 매칭)
#   title:      탭/섹션 제목
#   prompt:     학생에게 보여줄 질문 본문
#   min_chars:  이 글자 수 이상이어야 "제출" 버튼이 활성화됨

questions:
  - id: "q1_conceptual_change"
    title: "개념 변화"
    prompt: |
      AI와 대화하기 전과 지금, 이 단원의 핵심 개념에 대한 본인의 이해가 어떻게
      달라졌나요? 특히 바뀐 부분과 바뀌지 않은 부분을 모두 구체적으로 써주세요.
      바뀌지 않았다고 생각한다면 그 이유도 함께 적어주세요.
    min_chars: 100

  - id: "q2_effective_question"
    title: "AI 질문의 효과"
    prompt: |
      AI(동료 학습자)가 던진 질문 중에서 본인 사고를 가장 많이 자극하거나
      이해를 깊게 만든 질문 하나를 꼽고, 왜 그 질문이 효과적이었는지
      구체적으로 설명해주세요. (대화 기록을 참고해도 됩니다)
    min_chars: 100

  - id: "q3_scaffolding"
    title: "막힘과 도움"
    prompt: |
      대화 중 본인이 막히거나 헷갈렸던 순간이 있었다면 어떤 순간이었고,
      어떻게 빠져나왔나요? AI의 반응 중 도움이 된 것과 오히려 혼란스럽게
      한 것이 있다면 구체적으로 언급해주세요.
    min_chars: 100

  - id: "q4_counterfactual"
    title: "대안적 설명 전략"
    prompt: |
      이 대화를 처음부터 다시 한다면, 어떻게 다르게 설명하거나 어떤 순서로
      풀어갈 것 같나요? 오늘의 시행착오를 바탕으로 구체적인 전략 한두 가지를
      예시와 함께 써주세요.
    min_chars: 100

  - id: "q5_learning_by_teaching"
    title: "설명하며 배우기"
    prompt: |
      AI에게 설명하는 행위 자체가 본인의 개념 이해에 어떤 영향을 주었다고
      느끼시나요? 교과서를 다시 읽는 것과 비교해서 어떤 점이 달랐는지
      구체적으로 써주세요.
    min_chars: 100
